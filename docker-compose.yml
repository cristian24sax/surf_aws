services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: surf-school-api

    environment:
      NODE_ENV: development
      PORT: '3000'

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: surf_school
      DB_PASSWORD: surf_school
      DB_DATABASE: surf_school

      # Valkey
      VALKEY_HOST: valkey
      VALKEY_PORT: '6379'
      VALKEY_TLS: 'false'

    ports:
      - '3000:3000'

    depends_on:
      postgres:
        condition: service_started
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: surf-school-postgres

    environment:
      POSTGRES_USER: surf_school
      POSTGRES_PASSWORD: surf_school
      POSTGRES_DB: surf_school

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.1
    container_name: surf-school-valkey
    restart: unless-stopped

    ports:
      - '127.0.0.1:6380:6379'

    volumes:
      - valkey_data:/data

    command:
      - valkey-server
      - --appendonly
      - 'yes'

    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
